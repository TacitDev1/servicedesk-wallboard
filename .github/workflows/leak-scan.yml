# Copy to .github/workflows/leak-scan.yml in every portfolio repo.
# Add the private denylist as a repository secret named LEAK_DENYLIST
# (Settings > Secrets and variables > Actions), terms separated by commas or new lines.
name: Leak scan
on:
  push:
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Names, hosts and addresses
        run: node scripts/leak-scan.mjs
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
      # Runs the gitleaks CLI over the whole history. (gitleaks-action fails on a
      # first push of several commits: it scans from the root commit's parent.)
      - name: Secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1
